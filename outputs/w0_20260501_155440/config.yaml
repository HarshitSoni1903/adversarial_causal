seed: 42
data:
  mrtt_dir: data/mrtt
  train_condition: RND
  output_path: data/behavioral_rnd_dataset.csv
  original_endowment: 20
  original_rounds: 10
  multiplier: 3
  bucketing_rule: paper_range
behavioral_rnn:
  hidden_size: 5
  dropout: 0.2
  input_size: 6
  n_actions: 5
  action_values:
  - 0
  - 5
  - 10
  - 15
  - 20
  prepend_dummy: true
  lr: 0.003
  epochs: 120
  batch_size: 64
  train_frac: 0.8
  grad_clip: 1.0
  save_path: checkpoints/behavioral_rnn.pt
  inference_sample: true
  spillover_alpha: 0.0
  trust_decay: 0.8
training:
  mode: batch
  iterative:
    passes: 3
    shuffle_each_pass: true
    grad_accum_steps: 1
adversary:
  type: dqn
  repayment_actions:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  hidden_layers:
  - 128
  - 128
  lr: 0.0001
  epsilon_start: 0.2
  epsilon_min: 0.01
  epsilon_decay: 0.9999
  gamma: 0.99
  replay_buffer_size: 400000
  batch_size: 64
  target_update_freq: 1000
  training_episodes: 50000
  eval_interval: 1000
  eval_episodes: 200
  save_dir: checkpoints/
  mode: independent_q_learning
game:
  Two-agent example (comment out above, uncomment below): null
  agents:
  - name: fair_1
    type: fair
    save_path: checkpoints/sweep_g080_w0_fair_1.pt
  - name: max_1
    type: max
    save_path: checkpoints/sweep_g080_w0_max_1.pt
  max_rounds: 10
  endowment_per_agent: 20
  multiplier: 3
  min_investment: 0
  allocation_rule: trust_ranked
  tiebreaker: config_order
  clip_rounding: down
  observation_depth: 4
world:
  mode: 0
export:
  output_dir: outputs/
  filename: game_log.csv
  json_log_interval: 1
