seed: 42
data:
  mrtt_dir: data/mrtt
  train_condition: RND
  output_path: data/behavioral_rnd_dataset.csv
  original_endowment: 20
  original_rounds: 10
  multiplier: 3
behavioral_rnn:
  hidden_size: 64
  dropout: 0.1204
  input_size: 4
  n_actions: 5
  actions:
  - 0
  - 5
  - 10
  - 15
  - 20
  lr: 0.009857
  epochs: 200
  batch_size: 128
  train_frac: 0.8
  grad_clip: 1.892
  use_class_weights: true
  save_path: checkpoints/behavioral_rnn.pt
world:
  communication: false
  observation_depth: 4
investor:
  learns: true
  actions:
  - 0
  - 5
  - 10
  - 15
  - 20
  lr: 0.001
  epsilon_start: 0.2
  epsilon_decay: 0.995
  epsilon_min: 0.01
  gamma: 0.95
  replay_buffer_size: 200000
  batch_size: 64
  hidden_layers:
  - 128
  - 128
  target_update_freq: 1000
  save_name: investor_ql.pt
game:
  max_rounds: 10000
  endowment: 10000
  multiplier: 3
  min_investment: 1
agents:
- name: fair_1
  policy: fair
  repayment_actions:
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 1.0
- name: max_1
  policy: max
  repayment_actions:
  - 0.0
  - 0.05
  - 0.1
  - 0.2
  - 0.35
  - 0.5
- name: rnd_1
  policy: random
  repayment_actions:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
dqn:
  repayment_actions:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  hidden_layers:
  - 128
  - 128
  lr: 0.001
  epsilon_start: 0.2
  epsilon_decay: 0.998
  epsilon_min: 0.01
  gamma: 0.95
  replay_buffer_size: 400000
  batch_size: 64
  target_update_freq: 1000
  training_episodes: 3000
  training_rounds: 50
  eval_interval: 300
  eval_episodes: 50
checkpoints:
  base_dir: checkpoints
export:
  output_dir: outputs/
  filename: game_log.csv
  json_log_interval: 100
