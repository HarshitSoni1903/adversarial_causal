seed: 42
data:
  mrtt_dir: data/mrtt
  train_condition: RND
  output_path: data/behavioral_rnd_dataset.csv
  original_endowment: 20
  original_rounds: 10
  multiplier: 3
  bucketing_rule: paper_range
behavioral_rnn:
  hidden_size: 5
  dropout: 0.2
  input_size: 6
  n_actions: 5
  action_values:
  - 0
  - 5
  - 10
  - 15
  - 20
  prepend_dummy: true
  lr: 0.003
  epochs: 120
  batch_size: 64
  train_frac: 0.8
  grad_clip: 1.0
  save_path: checkpoints/behavioral_rnn.pt
  inference_sample: true
  trust_decay: 0.9
training:
  mode: batch
  iterative:
    passes: 3
    shuffle_each_pass: true
    grad_accum_steps: 1
adversary:
  type: dqn
  repayment_actions:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  hidden_layers:
  - 128
  - 128
  lr: 0.0001
  epsilon_start: 0.2
  epsilon_min: 0.01
  epsilon_decay: 0.9999
  gamma: 0.99
  replay_buffer_size: 400000
  batch_size: 64
  target_update_freq: 1000
  training_episodes: 50000
  eval_interval: 10000
  eval_episodes: 500
  matrix_eval_episodes: 1000
  save_dir: checkpoints/
  mode: independent_q_learning
game:
  dyads:
  - investor: i1
    trustee:
      name: a1
      type: max
      save_path: checkpoints/{condition}_a1.pt
  - investor: i2
    trustee:
      name: a2
      type: fair
      save_path: checkpoints/{condition}_a2.pt
  endowment_per_investor: 20
  multiplier: 3
  max_rounds: 10
  observation_depth: 4
edges:
  ii_edge: 1
  aa_edge: 1
export:
  output_dir: outputs/
  filename: game_log.csv
  json_log_interval: 1
