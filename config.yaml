seed: 42

# --- Phase 1: Data parsing ---
data:
  mrtt_dir: "data/mrtt"
  train_condition: "RND"
  output_path: "data/behavioral_rnd_dataset.csv"
  original_endowment: 20
  original_rounds: 10
  multiplier: 3

# --- Phase 2: Behavioral RNN (learner model) ---
behavioral_rnn:
  hidden_size: 5
  dropout: 0.2
  input_size: 4
  n_actions: 5
  actions: [0, 5, 10, 15, 20]
  lr: 0.003
  epochs: 120
  batch_size: 64
  train_frac: 0.80
  grad_clip: 1.0
  use_class_weights: true
  save_path: "checkpoints/behavioral_rnn.pt"

# --- World ---
world:
  communication: true
  observation_depth: 4

# --- Investor Q-learner ---
investor:
  learns: true
  actions: [0, 5, 10, 15, 20]
  lr: 1.0e-3
  epsilon_start: 0.2
  epsilon_decay: 0.97
  epsilon_min: 0.01
  gamma: 0.95
  replay_buffer_size: 200000
  batch_size: 64
  hidden_layers: [128, 128]
  target_update_freq: 1000
  save_name: "investor_ql.pt"

# --- Game simulation ---
game:
  max_rounds: 10000
  endowment: 10000
  multiplier: 3
  min_investment: 0

# --- Agents ---
agents:
  - name: "fair_1"
    policy: "fair"
    repayment_actions: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]

  - name: "max_1"
    policy: "max"
    repayment_actions: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]
  
  - name: "fair_2"
    policy: "fair"
    repayment_actions: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]

  - name: "max_2"
    policy: "max"
    repayment_actions: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]  

# --- DQN training hyperparams (shared by all non-random agents) ---
dqn:
  repayment_actions: [0.0, 0.25, 0.50, 0.75, 1.0]
  hidden_layers: [128, 128]
  lr: 1.0e-3
  epsilon_start: 0.2
  epsilon_decay: 0.97
  epsilon_min: 0.01
  gamma: 0.95
  replay_buffer_size: 400000
  batch_size: 64
  target_update_freq: 1000
  training_episodes: 100
  training_rounds: 10000
  eval_interval: 10
  eval_episodes: 5

# --- Live simulation ---
live_simulation:
  enabled: true
  rounds: 10000
  use_pretrained: true
  epsilon: 0.1

# --- Checkpoints ---
checkpoints:
  base_dir: "checkpoints"

# --- CSV Export ---
export:
  output_dir: "outputs/"
  filename: "game_log.csv"
  json_log_interval: 100